<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>Code Fighter — Campaign</title>

<body>

<!-- ═══════ SCREEN: MENU ═══════ -->
<div class="screen" id="screen-menu">
  <div class="hub">
    <header class="hub-head">
      <h1>⚔️ Code Fighter</h1>
      <span class="hub-streak" id="hubStreak" aria-label="Current streak"></span>
      <button class="hub-more" id="hubMore" aria-label="More" aria-expanded="false" aria-haspopup="true">⋯</button>
      <div class="hub-more-menu" id="hubMoreMenu" hidden>
        <button class="menu-btn" id="btnCinema"><span class="icon">🎬</span><div><strong>Cinema</strong><small>Spend coins on a song, clip or episode</small></div></button>
        <button class="menu-btn" id="btnShop"><span class="icon">🛒</span><div><strong>Shop</strong><small>Spend coins on upgrades</small></div></button>
        <button class="menu-btn" id="btnSettings"><span class="icon">⚙️</span><div><strong>Settings</strong><small>Audio, stats, profile, reset</small></div></button>
        <label class="hub-toggle"><input type="checkbox" id="hubGameToggle"> Show game extras (shop, XP bar)</label>
      </div>
    </header>

    <main class="hub-main">
      <section class="hub-panel" id="hubToday" aria-label="Today"></section>

      <section class="hub-panel" id="hubLearn" aria-label="Learn" hidden>
        <button class="menu-btn" id="btnLearn">
          <span class="icon">🎓</span>
          <div><strong>All lessons</strong><small>Watch · predict · drive the pointers · AI tutor</small></div>
        </button>
        <button class="menu-btn" id="btnEasyBank" hidden>
          <span class="icon">📚</span>
          <div><strong>All 50 problems</strong><small id="btnEasySub">Reference list · statements, solutions, notes</small></div>
        </button>
        <div id="hubLearnPath"></div>
      </section>

      <section class="hub-panel" id="hubPractice" aria-label="Practice" hidden>
        <div id="hubPracticeChips"></div>
        <div id="hubPracticeAlgo">
        <div id="hubPracticeDue"></div>
        <button class="menu-btn" id="btnBlitz">
          <span class="icon">⚡</span>
          <div><strong>Blitz Run</strong><small>10 questions · 10s each · random patterns</small></div>
        </button>
        <button class="menu-btn" id="btnCampaign">
          <span class="icon">🗺️</span>
          <div><strong>Campaign</strong><small>Linear progression · 52 levels · Vol 1</small></div>
        </button>
        </div>
        <div id="hubPracticeEasy"></div>
        <div id="hubPracticeEmpty" class="hub-empty" hidden></div>
      </section>

      <section class="hub-panel" id="hubProgress" aria-label="Progress" hidden></section>
    </main>

    <nav class="hub-tabs" role="tablist" aria-label="Main sections">
      <button class="hub-tab on" data-tab="today" role="tab" aria-selected="true"><span>🏠</span>Today</button>
      <button class="hub-tab" data-tab="learn" role="tab" aria-selected="false"><span>🎓</span>Learn</button>
      <button class="hub-tab" data-tab="practice" role="tab" aria-selected="false"><span>⚡</span>Practice</button>
      <button class="hub-tab" data-tab="progress" role="tab" aria-selected="false"><span>📈</span>Progress</button>
    </nav>
  </div>
</div>

<!-- ═══════ SCREEN: MAP ═══════ -->
<div class="screen" id="screen-map">
  <div id="profileBar"></div>

  <div class="map-header">
    <button class="back-btn" id="btnMapBack">← Menu</button>
    <div style="flex:1">
      <div class="map-title">Campaign Map</div>
      <div class="map-sub" id="mapProgress">0 / 52 levels cleared</div>
    </div>
  </div>

  <div id="weakSpotBanner"></div>
  <div id="reviewNode"></div>
  <div id="mapList" class="level-list"></div>
</div>

<!-- ═══════ SCREEN: FIGHT (placeholder) ═══════ -->
 <div class="screen" id="screen-fight">
  <!-- HUD -->
  <header class="fight-hud">
    <div class="fight-fighter-info">
      <span class="fight-name">🥷 You</span>
      <div class="fight-bar"><div class="fight-fill" id="fightPlayerHealth" style="width:100%"></div></div>
    </div>
    <div class="fight-timer-box">
      <div class="fight-timer" id="fightTimer">0:00</div>
      <div class="fight-timer-label">TIME</div>
    </div>
    <div class="fight-fighter-info right">
      <span class="fight-name enemy-name" id="fightEnemyName">👾 Bot</span>
      <div class="fight-bar"><div class="fight-fill enemy-fill" id="fightEnemyHealth" style="width:100%"></div></div>
    </div>
  </header>

  <!-- Arena -->
  <div class="arena" id="fightArena">
    <div class="fighter player" id="fightPlayer">🥷</div>
    <div class="fighter enemy" id="fightEnemy">👾</div>
  </div>

  <!-- Question area -->
  <div class="fight-question-wrap">
    <div class="boss-banner" id="bossBanner" style="display:none"></div>
    <div class="fight-question-head">
      <span class="question-counter" id="questionCounter">Q1 / 5</span>
      <span class="tier-timer" id="tierTimer" data-tier="perfect">0.0s</span>
    </div>
    <div id="questionWrap"></div>
    <div class="fight-feedback" id="fightFeedback"></div>
    <div class="fight-actions">
      <button class="btn ghost" id="fightHint">💡 Hint (−5 HP)</button>
      <button class="btn ghost" id="fightSkip">⏭ Skip (−10 HP)</button>
      <button class="btn ghost" id="fightExit">✕ Exit</button>
    </div>
  </div>
</div>

<!-- ═══════ SCREEN: SHOP ═══════ -->
<div class="screen" id="screen-shop">
  <div id="shopContent"></div>
</div>

<!-- ═══════ SCREEN: SETTINGS ═══════ -->
<div class="screen" id="screen-settings">
  <div id="settingsContent"></div>
</div>

<!-- ═══════ SCREEN: RECAP ═══════ -->
<div class="screen" id="screen-recap">
  <div id="recapContent"></div>
</div>

<!-- ═══════ SCREEN: LEARN ═══════ -->
<div class="screen" id="screen-learn">
  <div id="learnContent"></div>
</div>

<!-- ═══════ SCREEN: CINEMA ═══════ -->
<div class="screen" id="screen-cinema">
  <div id="cinemaContent"></div>
</div>

<!-- ═══════ SCREEN: EASY CODING ═══════ -->
<div class="screen" id="screen-easy">
  <div id="easyContent"></div>
</div>

<!-- ═══════ SCRIPTS ═══════ -->
<script>
/* visible error toast: if anything ever fails, say so instead of silently freezing */
window.addEventListener('error', function (e) {
  try {
    var t = document.getElementById('cfErr') || document.body.appendChild(Object.assign(document.createElement('div'), { id: 'cfErr' }));
    t.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:99999;background:#7f1d1d;color:#fee2e2;padding:8px 12px;border-radius:10px;font:12px/1.4 system-ui;';
    t.textContent = '⚠️ ' + (e.message || 'Script error') + ' — try a hard refresh (Ctrl/Cmd+Shift+R). Tap to dismiss.';
    t.onclick = function () { t.remove(); };
  } catch (x) {}
});
</script>
